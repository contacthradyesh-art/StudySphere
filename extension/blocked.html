<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Focus Shield — Blocked</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1e1033, #0a0612 70%);
    color: #f4f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .emoji { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b8adcf; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  a.btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🛡️</div>
    <h1>This is blocked during Focus Shield</h1>
    <p>You're in an active focus session on StudySphere. This site is on your distraction block list until the session ends.</p>
    <a class="btn" href="http://localhost:3000/dashboard/focus">Back to StudySphere</a>
  </div>
</body>
</html>
