<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>StudySphere Focus Shield</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 16px;
    background: #0f0a1a;
    color: #f4f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  .status {
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .active { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.4); }
  .inactive { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #b8adcf; }
  ul { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: #b8adcf; }
  button {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    border: none;
    border-radius: 10px;
    background: rgba(239,68,68,0.15);
    color: #fca5a5;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h2>🛡️ Focus Shield</h2>
  <div id="status" class="status inactive">Loading...</div>
  <div id="list"></div>
  <button id="stopBtn" style="display:none;">Stop focus session</button>
  <script src="popup.js"></script>
</body>
</html>
