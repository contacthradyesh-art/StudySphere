<title>StudySphere — Premium Product Preview</title>
<style>
:root{--bg:#0a0a0f;--surface:#15151f;--surface2:#1b1b29;--border:#29293a;--muted:#9292a8;--text:#f5f4fb;--violet:#7c3aed;--violet2:#8b5cf6;--pink:#d946ef;--green:#34d399;--amber:#fbbf24;--red:#fb7185;--r:18px;--shadow:0 18px 48px #0005}
[data-theme=light]{--bg:#f5f5fa;--surface:#fff;--surface2:#f0eff8;--border:#e4e2ed;--muted:#6b6880;--text:#171522;--shadow:0 12px 36px #30205a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--border);background:var(--bg);overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 25px;font-weight:800;font-size:17px;letter-spacing:-.4px}.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--pink));display:grid;place-items:center;box-shadow:0 5px 20px #7c3aed66}.group{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.4px;padding:15px 11px 7px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;background:transparent;color:var(--muted);text-align:left;margin:2px 0}.nav:hover,.nav.active{background:linear-gradient(90deg,#7c3aed25,#d946ef0d);color:var(--text)}.nav.active{box-shadow:inset 2px 0 var(--violet2)}.nav .ico{width:20px;text-align:center}.side-bottom{position:absolute;bottom:16px;left:14px;right:14px}.profile-mini{border-top:1px solid var(--border);padding:15px 8px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#d946ef);font-weight:800}.muted{color:var(--muted)}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);z-index:5}.crumb{color:var(--muted)}.topright{display:flex;gap:9px;align-items:center}.iconbtn,.ghost{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 12px}.content{max-width:1440px;margin:auto;padding:30px}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--violet2);font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800}.h1{font-size:29px;letter-spacing:-1px;line-height:1.2;margin:4px 0 7px;font-weight:800}.sub{color:var(--muted)}.primary{background:linear-gradient(110deg,var(--violet),var(--violet2),var(--pink));padding:10px 15px;border-radius:11px;color:white;font-weight:700;box-shadow:0 7px 22px #7c3aed35}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.cols{grid-template-columns:minmax(0,1.55fr) minmax(290px,.9fr)}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}.statnum{font-size:27px;font-weight:800;letter-spacing:-1px;margin:8px 0 1px}.statlabel{font-size:12px;color:var(--muted)}.statfoot{font-size:11px;color:var(--green);margin-top:6px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:750}.pill{border:1px solid var(--border);background:var(--surface2);padding:5px 9px;border-radius:99px;color:var(--muted);font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:7px;border-radius:9px;background:var(--surface2);overflow:hidden}.progress>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--pink))}.task{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}.task:last-child{border:0}.check{width:17px;height:17px;border:1px solid #77758a;border-radius:6px;margin-top:2px;flex:none}.task.done .check{background:var(--violet);border-color:var(--violet)}.task.done .taskname{text-decoration:line-through;color:var(--muted)}.taskname{font-weight:650}.taskmeta{font-size:11px;color:var(--muted);margin-top:3px}.barset{height:150px;display:flex;gap:13px;align-items:end;padding:12px 8px 0}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(30px,75%);border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--pink),var(--violet));min-height:4px}.barcol small{color:var(--muted);font-size:10px}.ring{--p:72%;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--violet2) var(--p),var(--surface2) 0);display:grid;place-items:center;position:relative}.ring:before{content:"";position:absolute;width:78px;height:78px;border-radius:50%;background:var(--surface)}.ring b{position:relative;font-size:23px}.subject{margin:13px 0}.subject .row{font-size:12px;margin-bottom:7px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:var(--surface2);border:1px solid var(--border);padding:7px 10px;border-radius:10px;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin:-3px 0 17px;overflow:auto}.tab{background:transparent;color:var(--muted);padding:10px 13px;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--text);border-color:var(--violet2)}.field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}.field:focus{border-color:var(--violet2)}.listitem{padding:12px 0;border-bottom:1px solid var(--border)}.listitem:last-child{border:0}.tag{font-size:10px;border-radius:6px;padding:4px 7px;background:#7c3aed22;color:#b9a3ff}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.boardcol{background:var(--surface2);border-radius:13px;padding:12px}.boardtask{background:var(--surface);border:1px solid var(--border);padding:12px;border-radius:10px;margin-top:9px;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:10px}.day.on{background:#7c3aed99;color:white}.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qnum{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:11px}.qnum.mark{outline:1px solid var(--amber)}.modalback{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:18px}.modalback.show{display:grid}.modal{width:min(500px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:23px;box-shadow:var(--shadow)}.toast{position:fixed;right:20px;bottom:22px;background:#221f31;border:1px solid #57407e;color:#fff;padding:12px 16px;border-radius:12px;z-index:30;display:none}.toast.show{display:block}.mobilehead,.bottomnav{display:none}.timer{font-size:54px;font-weight:800;letter-spacing:-2px;text-align:center;margin:25px}.switch{appearance:none;width:36px;height:20px;border-radius:30px;background:#555;position:relative;cursor:pointer}.switch:checked{background:var(--violet)}.switch:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.switch:checked:after{left:19px}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2)}.heat i:nth-child(3n){background:#6d28d9}.heat i:nth-child(5n){background:#8b5cf6}.heat i:nth-child(7n){background:#c084fc}
@media(max-width:950px){.app{grid-template-columns:215px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.content{padding:22px}}
@media(max-width:650px){.app{display:block}.side{display:none}.top{height:58px;padding:0 15px}.content{padding:20px 15px 94px}.h1{font-size:25px}.pagehead{align-items:flex-start}.pagehead .primary{font-size:11px;padding:9px}.stats{gap:10px}.card{padding:15px}.cols3{grid-template-columns:1fr}.board{grid-template-columns:1fr}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.bottomnav button{background:transparent;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center}.bottomnav button.active{color:var(--violet2)}.mobilehead{display:block}.topright .hide-mobile{display:none}}
</style>

<main class="main">
<header class="top"><div><span class="crumb">Workspace</span> <span class="muted">/</span> <b id="crumb">Overview</b></div><div class="topright"><button class="iconbtn hide-mobile" onclick="toast('Search preview opened')">⌕ Search</button><button class="iconbtn" onclick="theme()">◐</button><button class="iconbtn" onclick="toast('You are all caught up')">♧</button><button class="avatar" onclick="go('profile')">S</button></div></header>

<script>
const names={dashboard:'Overview',planner:'Smart Planner',together:'Live Study Room',pomodoro:'Pomodoro',focus:'Focus Shield',ai:'AI Study Assistant',notes:'Notes & Library',flashcards:'Flashcards',mock:'Mock Tests',analytics:'Analytics',syllabus:'Syllabus Tracker',current:'Current Affairs',mission:'Mission IAS',english:'English Lab',journal:'Journal',settings:'Settings',spaced:'Spaced Repetition',results:'Test Results',profile:'My Profile',auth:'Login / Register'};
let current='dashboard',timer=1500,interval=null,tab='Today',flipped=false;
const $=s=>document.querySelector(s);
function head(k,desc,action=''){return '<div class="pagehead"><div><div class="eyebrow">STUDY SYSTEM</div><div class="h1">'+k+'</div><div class="sub">'+desc+'</div></div>'+(action?'<button class="primary" onclick="'+action+'">＋ Create new</button>':'')+'</div>'}
function card(title,body,extra=''){return '<div class="card"><div class="cardhead"><span>'+title+'</span>'+(extra||'')+'</div>'+body+'</div>'}
function stat(label,num,foot,ico){return '<div class="card"><div class="row"><span class="statlabel">'+label+'</span><span class="pill">'+ico+'</span></div><div class="statnum">'+num+'</div><div class="statfoot">'+foot+'</div></div>'}
const task=(n,m,done=false)=>'<div class="task '+(done?'done':'')+'" onclick="this.classList.toggle(\'done\')"><span class="check"></span><div><div class="taskname">'+n+'</div><div class="taskmeta">'+m+'</div></div></div>';
function render(){
$('#crumb').textContent=names[current]||'Overview';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));
let h='';
if(current==='dashboard'){
h=head('Good morning, Shubham 👋','Tuesday, 3 November · Small steps. Consistent progress.','toast(\'New task dialog\')')+
'<div class="grid stats">'+stat('STUDY TIME','4h 25m','↑ 18% vs yesterday','◷')+stat('TASKS COMPLETED','8 / 12','4 tasks remaining','✓')+stat('CURRENT STREAK','12 days','Personal best: 18 days','✦')+stat('MOCK TEST SCORE','78%','↑ 6% improvement','◎')+'</div>'+
'<div class="grid cols"><div class="grid">'+card('Today’s focus','<div class="row"><div><div style="font-size:25px;font-weight:800">72% <span class="muted" style="font-size:12px">daily goal</span></div><div class="progress" style="width:260px;margin:10px 0"><i style="width:72%"></i></div><span class="muted">4h 20m of 6h target</span></div><div class="ring"><b>72%</b></div></div>')+card('Today’s schedule','<div class="listitem row"><div><b>Polity — Fundamental Rights</b><div class="taskmeta">09:00 – 10:30 · Deep work</div></div><span class="tag">Done</span></div><div class="listitem row"><div><b>Modern History</b><div class="taskmeta">11:00 – 12:00 · Revision</div></div><span class="pill">Next</span></div><div class="listitem row"><div><b>Answer Writing</b><div class="taskmeta">14:00 – 15:00 · Practice</div></div><span class="pill">Upcoming</span></div><div class="listitem row"><div><b>Current Affairs</b><div class="taskmeta">17:00 – 17:45 · Reading</div></div><span class="pill">Upcoming</span></div>')+'</div>'+
'<div class="grid">'+card('Quick actions','<div class="grid cols3"><button class="chip" onclick="go(\'pomodoro\')">◷ Start focus</button><button class="chip" onclick="go(\'notes\')">＋ New note</button><button class="chip" onclick="go(\'mock\')">✓ Take test</button></div>')+card('Priority tasks',task('Revise Article 32 & 226','Polity · High priority')+task('Complete Modern History notes','History · 35 min')+task('Solve 25 CSAT questions','Aptitude · Medium',true))+card('AI recommendation','<div style="line-height:1.7">Your Polity accuracy improved this week. Spend 25 minutes revising Directive Principles next.<div style="margin-top:12px"><button class="primary" onclick="go(\'ai\')">Ask AI mentor →</button></div></div>')+'</div></div>';
}else if(current==='together'){
h=head('Study Together','Focus with a community. Shared sessions, room chat and gentle accountability.')+
'<div class="grid cols"><div class="grid">'+card('◉  UPSC Focus Room <span class="pill">● LIVE · Preview</span>','<div class="row"><div><div class="eyebrow">HOSTED BY</div><b>StudySphere Community</b><div class="taskmeta">Quiet focus · Room #UPSC-042</div></div><span class="tag">HOST</span></div><div style="text-align:center;padding:18px 0"><div class="eyebrow">SHARED POMODORO</div><div class="timer" id="roomtimer">25:00</div><div class="progress"><i id="roomprogress" style="width:0%"></i></div><div class="chips" style="justify-content:center;margin-top:15px"><button class="primary" id="roomstart" onclick="roomStart()">▶ Start 25 min</button><button class="ghost" onclick="roomBreak()">5m break</button><button class="ghost" onclick="roomReset()">↺ Reset</button></div></div><div class="grid cols3"><div><div class="statnum">04</div><div class="statlabel">Sessions</div></div><div><div class="statnum">12</div><div class="statlabel">Day streak</div></div><div><div class="statnum">1h 40m</div><div class="statlabel">Focus time</div></div></div><p class="taskmeta">Demo mode: this timer runs on this preview only. Live cross-device sync will be connected to Firebase in the app implementation.</p>')+
card('Students here <span class="pill">3 online · sample</span>','<div class="listitem row"><div class="row"><div class="avatar">A</div><div><b>Aarav</b><div class="taskmeta">Focusing · 18 min</div></div></div><span class="tag">FOCUSING</span></div><div class="listitem row"><div class="row"><div class="avatar">N</div><div><b>Neha</b><div class="taskmeta">Reading · 12 min</div></div></div><span class="tag">FOCUSING</span></div><div class="listitem row"><div class="row"><div class="avatar">R</div><div><b>Rahul</b><div class="taskmeta">On a short break</div></div></div><span class="pill">BREAK</span></div>')+'</div>'+
'<div class="grid">'+card('Room chat <span class="pill">Preview chat</span>','<div id="roomchat" style="height:225px;overflow:auto"><div class="listitem"><b>Aarav</b><div class="taskmeta">Let’s complete one focused session! 💪</div></div><div class="listitem"><b>Neha</b><div class="taskmeta">Starting Polity revision now.</div></div><div class="listitem"><b>StudySphere</b><div class="taskmeta">Be kind, stay focused and respect everyone.</div></div></div><div class="row" style="margin-top:12px"><input id="roommessage" class="field" placeholder="Message the room…" onkeydown="if(event.key===\'Enter\')sendRoomMessage()"><button class="primary" onclick="sendRoomMessage()">Send ↑</button></div><p class="taskmeta">Messages are local to this preview and are not sent to other users.</p>')+
card('Study room rules','<div class="listitem">🤫 Keep your microphone muted unless invited</div><div class="listitem">🎯 Respect everyone’s focus time</div><div class="listitem">💬 Keep chat supportive and study-related</div><div class="listitem">🌱 Take breaks and be kind to yourself</div>')+'</div></div>';
}else if(current==='planner'){
h=head('Plan your day','Turn priorities into focused action.','toast(\'New planner item\')')+'<div class="tabs">'+['Today','Timetable','Tasks','Goals','Habits'].map(x=>'<button class="tab '+(tab===x?'active':'')+'" onclick="tab=\''+x+'\';render()">'+x+'</button>').join('')+'</div>';
if(tab==='Today')h+='<div class="grid cols"><div class="card"><div class="cardhead">Tuesday · Time blocks <span class="pill">6 AM – 11 PM</span></div>'+['06:00 · Morning routine','07:00 · Newspaper + current affairs','09:00 · Indian Polity','11:00 · Modern History','14:00 · Answer writing','16:00 · CSAT practice','19:00 · Revision'].map((x,i)=>'<div class="listitem row"><b>'+x+'</b><span class="tag">'+(i===2?'Completed':'Planned')+'</span></div>').join('')+'</div>'+card('Daily goals','<div class="statnum">4h 25m</div><div class="muted">of 6 hour target</div><div class="progress" style="margin:12px 0"><i style="width:73%"></i></div><button class="primary" onclick="go(\'pomodoro\')">Start focus session</button>')+'</div>';
if(tab==='Timetable')h+=card('Weekly timetable','<div class="calendar">'+Array.from({length:35},(_,i)=>'<div class="day '+([2,8,9,15,18,22,25,30].includes(i)?'on':'')+'">'+(i%7+1)+'</div>').join('')+'</div><p class="muted">Select a day to inspect or edit planned blocks.</p>');
if(tab==='Tasks')h+='<div class="board">'+['To do','In progress','Done'].map((x,i)=>'<div class="boardcol"><b>'+x+'</b>'+['Revise Article 32','Read Laxmikanth','CSAT practice'].slice(i,i+2).map(t=>'<div class="boardtask">'+t+'<div class="taskmeta">Polity · '+(i?'Medium':'High')+'</div></div>').join('')+'</div>').join('')+'</div>';
if(tab==='Goals')h+='<div class="grid cols3">'+['Complete Polity','Daily 6h study','Finish Modern History'].map((x,i)=>card(x,'<div class="statnum">'+[68,82,35][i]+'%</div><div class="progress"><i style="width:'+[68,82,35][i]+'%"></i></div><p class="muted">Weekly progress</p>')).join('')+'</div>';
if(tab==='Habits')h+=card('Consistency tracker','<div class="heat">'+Array.from({length:84},()=>'<i></i>').join('')+'</div><p class="muted">84-day activity overview · Keep showing up.</p>');
}else if(current==='pomodoro'){

let roomSeconds=1500,roomInterval=null;
function roomFmt(){return String(Math.floor(roomSeconds/60)).padStart(2,'0')+':'+String(roomSeconds%60).padStart(2,'0')}
function roomPaint(){let t=$('#roomtimer'),p=$('#roomprogress');if(t)t.textContent=roomFmt();if(p)p.style.width=((1500-roomSeconds)/1500*100)+'%'}
function roomStart(){if(roomInterval)return;roomInterval=setInterval(()=>{roomSeconds=Math.max(0,roomSeconds-1);roomPaint();if(!roomSeconds){clearInterval(roomInterval);roomInterval=null;toast('Preview focus session complete!')}},1000);toast('Preview timer started')}
function roomBreak(){clearInterval(roomInterval);roomInterval=null;roomSeconds=300;roomPaint();toast('5-minute break selected')}
function roomReset(){clearInterval(roomInterval);roomInterval=null;roomSeconds=1500;roomPaint();toast('Room timer reset')}
function sendRoomMessage(){let i=$('#roommessage'),c=$('#roomchat');if(!i||!c||!i.value.trim())return;let d=document.createElement('div');d.className='listitem';let b=document.createElement('b');b.textContent='You';let p=document.createElement('div');p.className='taskmeta';p.textContent=i.value.trim();d.append(b,p);c.append(d);i.value='';c.scrollTop=c.scrollHeight}
let authType='login';
function authMode(mode){authType=mode;$('#loginTab').classList.toggle('active',mode==='login');$('#registerTab').classList.toggle('active',mode==='register');$('#authFields').innerHTML='<label class="taskmeta">Full name</label>'+(mode==='register'?'<input class="field" id="authName" placeholder="Your name" style="margin:6px 0 13px">':'')+'<label class="taskmeta">Email address</label><input class="field" id="authEmail" type="email" placeholder="you@example.com" style="margin:6px 0 13px"><label class="taskmeta">Password</label><input class="field" id="authPassword" type="password" placeholder="Enter password"><button class="primary" style="width:100%;margin-top:18px" onclick="authSubmit()">'+(mode==='login'?'Continue →':'Create account →')+'</button>'}
function authSubmit(){let e=$('#authEmail')?.value||'',p=$('#authPassword')?.value||'';if(!e.includes('@')||p.length<6){toast('Enter a valid email and password (6+ characters)');return}toast('Demo only: Firebase authentication is not connected on this screen')}
function go(p){current=p;tab='Today';render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function theme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'':'light'}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(interval)return;interval=setInterval(()=>{timer=Math.max(0,timer-1);let e=$('#timer');if(e)e.textContent=fmt(timer);if(!timer){pauseTimer();toast('Focus session complete!')}},1000);toast('Focus session started')}
function pauseTimer(){clearInterval(interval);interval=null;toast('Timer paused')}
function resetTimer(){pauseTimer();timer=1500;let e=$('#timer');if(e)e.textContent=fmt(timer)}
function setTimer(s){pauseTimer();timer=s;$('#timer').textContent=fmt(timer)}
function openModal(t,body){$('#modal').innerHTML='<div class="row"><h2>'+t+'</h2><button class="ghost" onclick="closeModal()">✕</button></div><p class="muted">'+body+'</p><button class="primary" onclick="closeModal()">Got it</button>';$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
function openTest(){openModal('Start UPSC practice test','This preview test contains sample questions. The real test engine should load its saved question bank, timer and attempt state.')}
function ask(q){$('#askbox').value=q;sendAsk()}
function sendAsk(){let x=$('#askbox').value.trim();if(!x)return;$('#chat').innerHTML+='<div class="listitem" style="text-align:right"><span class="tag">YOU</span><p>'+x.replace(/[<>]/g,'')+'</p></div><div class="listitem"><span class="tag">STUDYSPHERE AI</span><p>Let’s break this down into a clear concept, key points and an exam-focused example. This is prototype-only sample output.</p></div>';$('#askbox').value='';$('#chat').scrollTop=$('#chat').scrollHeight}
