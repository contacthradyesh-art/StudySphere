name: Map visual polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Improve map colors and legend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/mission-ias/advanced-map-practice.tsx')
          s = p.read_text()
          if 'const MAP_COLORS =' in s:
              raise SystemExit(0)

          old = "const PALETTE = ['#7c3aed', '#8b5cf6', '#a855f7', '#9333ea', '#c026d3', '#d946ef', '#6366f1', '#4f46e5'];"
          new = '''const MAP_COLORS = {\n  new: '#30283f',\n  weak: '#8b5cf6',\n  learning: '#f59e0b',\n  mastered: '#22c55e',\n  selected: '#c4b5fd',\n  target: '#f5f3ff',\n  wrong: '#ef4444',\n};\n\nfunction mapFill(progress?: StateProgress): string {\n  if (!progress) return MAP_COLORS.new;\n  const value = accuracy(progress);\n  if (value >= 70 && progress.correctCount >= 3) return MAP_COLORS.mastered;\n  if (value >= 50) return MAP_COLORS.learning;\n  return MAP_COLORS.weak;\n}'''
          if old not in s:
              raise SystemExit('palette anchor not found')
          s = s.replace(old, new, 1)

          old_fill = "fill={wrongHere ? '#ef4444' : feedback === 'correct' && targetHere ? '#22c55e' : PALETTE[index % PALETTE.length]}"
          new_fill = "fill={wrongHere ? MAP_COLORS.wrong : feedback === 'correct' && targetHere ? MAP_COLORS.mastered : selectedHere ? MAP_COLORS.selected : targetHere ? MAP_COLORS.target : mapFill(item)}"
          if old_fill not in s:
              raise SystemExit('fill anchor not found')
          s = s.replace(old_fill, new_fill, 1)

          s = s.replace("stroke={selectedHere || targetHere ? 'white' : 'rgba(255,255,255,.22)'}", "stroke={selectedHere || targetHere ? 'white' : 'rgba(255,255,255,.10)'}", 1)
          s = s.replace("strokeWidth={selectedHere || targetHere ? 1.8 : 0.55}", "strokeWidth={selectedHere || targetHere ? 2.2 : 0.35}", 1)
          s = s.replace("className=\"cursor-pointer transition-all duration-200 hover:brightness-125\"", "className=\"cursor-pointer transition-all duration-200 hover:brightness-125\"", 1)

          anchor = "</div>\n          {loading ? <div className=\"flex h-[560px] items-center justify-center text-sm text-muted-foreground\">Loading geography lab...</div>"
          legend = '''</div>\n          <div className=\"pointer-events-none absolute bottom-4 left-4 z-20 rounded-2xl border border-white/10 bg-charcoal-950/90 px-3 py-2.5 shadow-xl backdrop-blur-md\">\n            <p className=\"mb-2 text-[10px] font-bold uppercase tracking-[0.16em] text-muted-foreground\">Map mastery</p>\n            <div className=\"flex flex-wrap gap-x-3 gap-y-1.5 text-[10px] font-medium\">\n              <span className=\"flex items-center gap-1.5\"><i className=\"h-2.5 w-2.5 rounded-full\" style={{ background: MAP_COLORS.new }} /> New</span>\n              <span className=\"flex items-center gap-1.5\"><i className=\"h-2.5 w-2.5 rounded-full\" style={{ background: MAP_COLORS.weak }} /> Weak</span>\n              <span className=\"flex items-center gap-1.5\"><i className=\"h-2.5 w-2.5 rounded-full\" style={{ background: MAP_COLORS.learning }} /> Learning</span>\n              <span className=\"flex items-center gap-1.5\"><i className=\"h-2.5 w-2.5 rounded-full\" style={{ background: MAP_COLORS.mastered }} /> Mastered</span>\n            </div>\n          </div>\n          {loading ? <div className=\"flex h-[560px] items-center justify-center text-sm text-muted-foreground\">Loading geography lab...</div>'''
          if anchor not in s:
              raise SystemExit('legend anchor not found')
          s = s.replace(anchor, legend, 1)
          p.write_text(s)
          PY

      - name: Commit polished map
        shell: bash
        run: |
          git config user.name "study-sphere-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/map-colors.yml
          git add src/components/mission-ias/advanced-map-practice.tsx
          git commit -m "Improve Map Practice visual clarity"
          git push
